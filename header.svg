<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <!-- Ultra Dark Cyber Matrix Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050a" />
      <stop offset="50%" stop-color="#061224" />
      <stop offset="100%" stop-color="#02050a" />
    </linearGradient>

    <!-- East Turkistan Kok Bayraq Holographic Gradient -->
    <linearGradient id="kokBayraqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#0096c7" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Cyber Neon Accent -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#03045e" stop-opacity="0" />
    </linearGradient>

    <!-- Title Chrome Glow -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Ambient Radar Aura -->
    <radialGradient id="mapAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0077b6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#02050a" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Tactical Grid -->
    <pattern id="techGrid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#0f2942" stroke-width="0.7" stroke-opacity="0.55" />
      <circle cx="35" cy="35" r="1" fill="#00f2fe" opacity="0.3" />
    </pattern>

    <!-- Hologram Scanlines -->
    <pattern id="holoLines" width="10" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14" />
    </pattern>

    <!-- Intense Laser Glow Filter -->
    <filter id="laserGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="9" result="blur2" />
      <feGaussianBlur stdDeviation="18" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft HUD Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Map Vector Path (Normalized pathLength="1000") -->
    <path id="mapPath" pathLength="1000" d="M607,108 L615,112 L615,128 L626,138 L628,152 L668,178 L696,185 L720,212 L726,232 L740,250 L740,305 L746,336 L815,344 L868,372 L910,386 L936,405 L940,445 L952,466 L950,480 L936,495 L932,540 L890,560 L812,578 L818,620 L828,666 L745,682 L704,704 L732,725 L744,756 L750,772 L735,780 L756,804 L730,810 L695,818 L675,810 L642,804 L595,808 L550,825 L515,845 L495,848 L460,842 L440,848 L412,828 L382,842 L358,862 L322,865 L285,882 L265,892 L240,880 L230,842 L195,825 L165,820 L145,795 L150,772 L125,762 L100,765 L85,745 L105,725 L95,695 L75,680 L55,685 L55,665 L48,650 L60,628 L80,608 L100,595 L125,600 L145,578 L205,560 L245,535 L280,520 L318,490 L330,455 L342,435 L330,405 L322,375 L302,360 L318,345 L335,342 L395,345 L398,315 L415,275 L430,232 L448,238 L495,250 L530,250 L526,208 L532,165 L565,148 L575,118 Z" />

    <clipPath id="mapClip">
      <use href="#mapPath" />
    </clipPath>
  </defs>

  <!-- Main Outer Frame -->
  <rect width="1000" height="440" rx="18" fill="url(#bgGrad)" stroke="#0f2942" stroke-width="2" />
  <rect width="1000" height="440" rx="18" fill="url(#techGrid)" />

  <!-- HUD Corner Brackets -->
  <path d="M 18 45 L 18 18 L 45 18" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />
  <path d="M 982 45 L 982 18 L 955 18" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />
  <path d="M 18 395 L 18 422 L 45 422" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />
  <path d="M 982 395 L 982 422 L 955 422" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />

  <!-- Top & Bottom Laser Accents -->
  <path d="M 60 2 L 320 2" stroke="url(#cyberNeon)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />
  <path d="M 680 438 L 940 438" stroke="url(#cyberNeon)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />

  <!-- Ambient Glow & Tactical Radar Rings Behind Map -->
  <circle cx="765" cy="225" r="215" fill="url(#mapAura)">
    <animate attributeName="r" values="200;230;200" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <g transform="translate(765, 225)">
    <circle cx="0" cy="0" r="190" fill="none" stroke="#00b4d8" stroke-width="1.2" stroke-dasharray="12 18 50 18" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="168" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 20" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite" />
    </circle>
    <!-- Crosshair lines -->
    <line x1="-205" y1="0" x2="-175" y2="0" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
    <line x1="175" y1="0" x2="205" y2="0" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="-205" x2="0" y2="-175" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="175" x2="0" y2="205" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
  </g>

  <!-- ==================== LEFT PANEL: ELITE HACKER / ARCHITECT HUD ==================== -->
  <g transform="translate(55, 52)">
    
    <!-- Root Terminal Status Pill -->
    <g>
      <rect x="0" y="0" width="335" height="32" rx="6" fill="#050d1a" stroke="#00b4d8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="18" cy="16" r="4.5" fill="#00f2fe" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="20" fill="#00f2fe" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="12" font-weight="700" letter-spacing="1.2">
        root@uysardar:~# ACCESS_GRANTED
      </text>
    </g>

    <!-- Hacker Classification Header -->
    <text x="0" y="68" fill="#38bdf8" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14.5" font-weight="700" letter-spacing="2.5">
      [ // CYBEROPS & OFFENSIVE SECURITY ]
    </text>

    <!-- Main Identity Title -->
    <text x="0" y="122" fill="url(#titleGrad)" font-family="&#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="50" font-weight="900" letter-spacing="1">
      SARDAR <tspan fill="#00f2fe" font-family="Consolas, monospace" font-size="34" font-weight="700">// 0xUYS</tspan>
    </text>

    <!-- Elite Role Subtitle -->
    <text x="0" y="158" fill="#e2e8f0" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15.5" font-weight="600">
      > Exploit Research • Stealth Automation • AI Systems Architect
    </text>
    <text x="0" y="182" fill="#64748b" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="13">
      "Infiltrating complexity. Engineering resilient & autonomous code."
    </text>

    <!-- Animated Laser Scanner Divider -->
    <rect x="0" y="202" width="465" height="2" rx="1" fill="#0f2942" />
    <rect x="0" y="201" width="180" height="4" rx="2" fill="url(#cyberNeon)" filter="url(#softGlow)">
      <animate attributeName="x" values="0;285;0" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Tactical Skill Matrix Pills -->
    <g transform="translate(0, 224)" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="12.5" font-weight="700">
      <rect x="0" y="0" width="145" height="34" rx="6" fill="#06152d" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="72.5" y="21" fill="#00f2fe" text-anchor="middle">[0x01] SEC_AUDIT</text>

      <rect x="158" y="0" width="145" height="34" rx="6" fill="#06152d" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.5" />
      <text x="230.5" y="21" fill="#e0f2fe" text-anchor="middle">[0x02] AI_BOTNET</text>

      <rect x="316" y="0" width="148" height="34" rx="6" fill="#06152d" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.5" />
      <text x="390" y="21" fill="#e0f2fe" text-anchor="middle">[0x03] CORE_DEV</text>
    </g>

    <!-- Bottom Live Telemetry & Encryption Readout -->
    <g transform="translate(0, 286)">
      <!-- Equalizer Bars -->
      <g fill="#00f2fe" opacity="0.9">
        <rect x="0" y="8" width="4" height="16" rx="1">
          <animate attributeName="height" values="6;24;6" dur="0.9s" repeatCount="indefinite" />
          <animate attributeName="y" values="15;6;15" dur="0.9s" repeatCount="indefinite" />
        </rect>
        <rect x="8" y="4" width="4" height="24" rx="1">
          <animate attributeName="height" values="24;8;24" dur="1.2s" repeatCount="indefinite" />
          <animate attributeName="y" values="6;14;6" dur="1.2s" repeatCount="indefinite" />
        </rect>
        <rect x="16" y="10" width="4" height="12" rx="1">
          <animate attributeName="height" values="10;26;10" dur="0.8s" repeatCount="indefinite" />
          <animate attributeName="y" values="13;5;13" dur="0.8s" repeatCount="indefinite" />
        </rect>
        <rect x="24" y="6" width="4" height="20" rx="1">
          <animate attributeName="height" values="20;6;20" dur="1.1s" repeatCount="indefinite" />
          <animate attributeName="y" values="8;15;8" dur="1.1s" repeatCount="indefinite" />
        </rect>
      </g>
      <text x="40" y="21" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">
        ENCRYPT: AES-256-GCM // NODE: @Uysardar // ONLINE
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: HOLOGRAPHIC MAP WITH KOK BAYRAQ ==================== -->
  <g transform="translate(555, 12) scale(0.43)">
    
    <!-- 1. Outer Deep Cyan Laser Glow -->
    <use href="#mapPath" fill="#00b4d8" opacity="0.35" filter="url(#laserGlow)" />

    <!-- 2. Clipped Map Interior: Kok Bayraq Flag + Hologram Effects -->
    <g clip-path="url(#mapClip)">
      <!-- Kok Bayraq Sky-Blue Base Fill -->
      <rect x="0" y="0" width="1000" height="1000" fill="url(#kokBayraqGrad)" />

      <!-- Subtle Radial Light in Map Center -->
      <circle cx="480" cy="540" r="380" fill="#48cae4" opacity="0.25" filter="url(#laserGlow)" />

      <!-- ===== EAST TURKISTAN CRESCENT & STAR (ئاي-يۇلتۇز) ===== -->
      <g filter="url(#softGlow)" transform="translate(0, 10)">
        <!-- Outer White Crescent Circle minus Inner Sky-Blue Circle -->
        <path d="M 520 403 A 145 145 0 1 0 520 657 A 118 118 0 1 1 520 403 Z" fill="#ffffff" />
        
        <!-- 5-Pointed White Star tilted toward Crescent -->
        <polygon points="0,-58 17,-18 55,-18 24,7 36,47 0,23 -36,47 -24,7 -55,-18 -17,-18" fill="#ffffff" transform="translate(575, 530) rotate(-18)" />
      </g>

      <!-- Holographic Scanline Overlay -->
      <rect x="0" y="0" width="1000" height="1000" fill="url(#holoLines)" />

      <!-- Moving Vertical Laser Scanner Beam -->
      <rect x="0" y="-150" width="1000" height="85" fill="#ffffff" opacity="0.22" filter="url(#laserGlow)">
        <animate attributeName="y" values="-150;1000;-150" dur="6s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- 3. Crisp Inner Map Border -->
    <use href="#mapPath" fill="none" stroke="#e0f2fe" stroke-width="4" opacity="0.7" />

    <!-- 4. Primary Neon Laser Runner (Cyan-White) -->
    <use href="#mapPath" fill="none" stroke="#00f2fe" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="170 830" filter="url(#laserGlow)">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="5.5s" repeatCount="indefinite" />
    </use>
    <use href="#mapPath" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140 860">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="5.5s" repeatCount="indefinite" />
    </use>

    <!-- 5. Secondary Opposite Laser Runner (Electric Blue-White) -->
    <use href="#mapPath" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="120 880" filter="url(#laserGlow)">
      <animate attributeName="stroke-dashoffset" from="500" to="-500" dur="5.5s" repeatCount="indefinite" />
    </use>
    <use href="#mapPath" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90 910">
      <animate attributeName="stroke-dashoffset" from="500" to="-500" dur="5.5s" repeatCount="indefinite" />
    </use>
  </g>

  <!-- Floating Cyber Data Nodes -->
  <g fill="#00f2fe" filter="url(#softGlow)">
    <circle cx="565" cy="80" r="2.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="110" r="2">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="590" cy="380" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="930" cy="365" r="2.5">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.7s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
