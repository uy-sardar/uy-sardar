  <rect width="1000" height="440" rx="18" fill="url(#bgGrad)" stroke="#0f2942" stroke-width="2" />
  <rect width="1000" height="440" rx="18" fill="url(#techGrid)" />
  <path d="M 18 45 L 18 18 L 45 18" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />
  <path d="M 982 45 L 982 18 L 955 18" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />
  <path d="M 18 395 L 18 422 L 45 422" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />
  <path d="M 982 395 L 982 422 L 955 422" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />
  <path d="M 60 2 L 320 2" stroke="url(#cyberNeon)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />
  <path d="M 680 438 L 940 438" stroke="url(#cyberNeon)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />
  <circle cx="765" cy="225" r="215" fill="url(#mapAura)">
    <animate attributeName="r" values="200;230;200" dur="4.5s" repeatCount="indefinite" />
  </circle>
  <g transform="translate(765, 225)">
    <circle cx="0" cy="0" r="190" fill="none" stroke="#00b4d8" stroke-width="1.2" stroke-dasharray="12 18 50 18" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="168" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 20" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite" />
    </circle>
  </g>
  <g transform="translate(55, 52)">
    <g>
      <rect x="0" y="0" width="335" height="32" rx="6" fill="#050d1a" stroke="#00b4d8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="18" cy="16" r="4.5" fill="#00f2fe" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="20" fill="#00f2fe" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">
        root@uy-sardar:~# ACCESS_GRANTED
      </text>
    </g>
    <text x="0" y="68" fill="#38bdf8" font-family="Consolas, monospace" font-size="14.5" font-weight="700" letter-spacing="2.5">
      [ // CYBEROPS & OFFENSIVE SECURITY ]
    </text>
    <text x="0" y="122" fill="url(#titleGrad)" font-family="Segoe UI, sans-serif" font-size="50" font-weight="900" letter-spacing="1">
      SARDAR <tspan fill="#00f2fe" font-family="Consolas, monospace" font-size="34" font-weight="700">// 0xUYS</tspan>
    </text>
    <text x="0" y="158" fill="#e2e8f0" font-family="Consolas, monospace" font-size="15.5" font-weight="600">
      > Exploit Research • Stealth Automation • AI Systems Architect
    </text>
    <text x="0" y="182" fill="#64748b" font-family="Consolas, monospace" font-size="13">
      "Infiltrating complexity. Engineering resilient & autonomous code."
    </text>
    <rect x="0" y="202" width="465" height="2" rx="1" fill="#0f2942" />
    <rect x="0" y="201" width="180" height="4" rx="2" fill="url(#cyberNeon)" filter="url(#softGlow)">
      <animate attributeName="x" values="0;285;0" dur="4s" repeatCount="indefinite" />
    </rect>
    <g transform="translate(0, 224)" font-family="Consolas, monospace" font-size="12.5" font-weight="700">
      <rect x="0" y="0" width="145" height="34" rx="6" fill="#06152d" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="72.5" y="21" fill="#00f2fe" text-anchor="middle">[0x01] SEC_AUDIT</text>
      <rect x="158" y="0" width="145" height="34" rx="6" fill="#06152d" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.5" />
      <text x="230.5" y="21" fill="#e0f2fe" text-anchor="middle">[0x02] AI_BOTNET</text>
      <rect x="316" y="0" width="148" height="34" rx="6" fill="#06152d" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.5" />
      <text x="390" y="21" fill="#e0f2fe" text-anchor="middle">[0x03] CORE_DEV</text>
    </g>
    <g transform="translate(0, 286)">
      <text x="0" y="21" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">
        ENCRYPT: AES-256-GCM // NODE: @uy-sardar // ONLINE
      </text>
    </g>
  </g>
  <g transform="translate(555, 12) scale(0.43)">
    <use href="#mapPath" fill="#00b4d8" opacity="0.35" filter="url(#laserGlow)" />
    <g clip-path="url(#mapClip)">
      <rect x="0" y="0" width="1000" height="1000" fill="url(#kokBayraqGrad)" />
      <circle cx="480" cy="540" r="380" fill="#48cae4" opacity="0.25" filter="url(#laserGlow)" />
      <g filter="url(#softGlow)" transform="translate(0, 10)">
        <path d="M 520 403 A 145 145 0 1 0 520 657 A 118 118 0 1 1 520 403 Z" fill="#ffffff" />
        <polygon points="0,-58 17,-18 55,-18 24,7 36,47 0,23 -36,47 -24,7 -55,-18 -17,-18" fill="#ffffff" transform="translate(575, 530) rotate(-18)" />
      </g>
      <rect x="0" y="0" width="1000" height="1000" fill="url(#holoLines)" />
      <rect x="0" y="-150" width="1000" height="85" fill="#ffffff" opacity="0.22" filter="url(#laserGlow)">
        <animate attributeName="y" values="-150;1000;-150" dur="6s" repeatCount="indefinite" />
      </rect>
    </g>
    <use href="#mapPath" fill="none" stroke="#e0f2fe" stroke-width="4" opacity="0.7" />
    <use href="#mapPath" fill="none" stroke="#00f2fe" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="170 830" filter="url(#laserGlow)">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="5.5s" repeatCount="indefinite" />
    </use>
    <use href="#mapPath" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140 860">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="5.5s" repeatCount="indefinite" />
    </use>
  </g>
</svg>
