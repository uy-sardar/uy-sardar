<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SARDAR (سەردار) — Cyber-Hacker Animated GitHub Avatar">
  <defs>
    <radialGradient id="hackerBg" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#0B223E" />
      <stop offset="55%" stop-color="#050F1E" />
      <stop offset="100%" stop-color="#02050B" />
    </radialGradient>
    <radialGradient id="visorCoreGlow" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <!-- Softened High-Clarity RGB Spectrum Gradient (8.5s cycle) -->
    <linearGradient id="hackerRgb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#10B981;#A855F7;#F43F5E;#38BDF8" dur="8.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#22D3EE;#EC4899;#F59E0B;#10B981" dur="8.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#38BDF8;#10B981;#22D3EE;#A855F7" dur="8.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="hoodOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112239" />
      <stop offset="50%" stop-color="#091322" />
      <stop offset="100%" stop-color="#040912" />
    </linearGradient>
    <linearGradient id="hoodShadowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#050C17" />
      <stop offset="100%" stop-color="#010307" />
    </linearGradient>
    <linearGradient id="visorLensGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="scanLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.0" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.95" />
    </filter>
    <clipPath id="avatarCircleClip">
      <circle cx="256" cy="256" r="224" />
    </clipPath>
    <clipPath id="visorClipLeft">
      <polygon points="184,196 248,205 244,224 190,217" />
    </clipPath>
    <clipPath id="visorClipRight">
      <polygon points="328,196 264,205 268,224 322,217" />
    </clipPath>
    <pattern id="hexGridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 28 8 L 28 20 L 14 28 L 0 20 L 0 8 Z" fill="none" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="0.9" />
    </pattern>
  </defs>

  <style>
    @keyframes floatHood {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes matrixDrop1 {
      0% { transform: translateY(-60px); opacity: 0.15; }
      50% { opacity: 0.65; }
      100% { transform: translateY(60px); opacity: 0.15; }
    }
    @keyframes matrixDrop2 {
      0% { transform: translateY(50px); opacity: 0.2; }
      50% { opacity: 0.7; }
      100% { transform: translateY(-50px); opacity: 0.2; }
    }
    @keyframes visorGlint {
      0%, 100% { transform: translateX(-70px); }
      50% { transform: translateX(70px); }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .hacker-float { animation: floatHood 5.2s ease-in-out infinite; }
    .matrix-col-a { animation: matrixDrop1 5.5s linear infinite; }
    .matrix-col-b { animation: matrixDrop2 6.8s linear infinite; }
    .visor-glint { animation: visorGlint 3.2s ease-in-out infinite; }
    .term-cursor { animation: cursorBlink 1.1s steps(1) infinite; }
  </style>

  <!-- Outer Rounded Dark Cyber Plate (Works both as Square SVG Card & Circular GitHub Avatar) -->
  <rect width="512" height="512" rx="44" fill="#02060F" />
  <rect x="3" y="3" width="506" height="506" rx="42" fill="none" stroke="url(#hackerRgb)" stroke-opacity="0.55" stroke-width="2" />

  <!-- Corner Cyber Target Brackets -->
  <g stroke="url(#hackerRgb)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M 22 48 L 22 22 L 48 22" />
    <path d="M 490 48 L 490 22 L 464 22" />
    <path d="M 22 464 L 22 490 L 48 490" />
    <path d="M 490 464 L 490 490 L 464 490" />
  </g>

  <!-- Outer Circular Avatar Frame -->
  <circle cx="256" cy="256" r="236" fill="url(#hackerBg)" stroke="url(#hackerRgb)" stroke-width="4.5" />

  <!-- Counter-Rotating Outer Cyber-HUD Rings -->
  <g>
    <circle cx="256" cy="256" r="228" fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="14 10 3 10" />
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="28s" repeatCount="indefinite" />
  </g>
  <g filter="url(#cyberGlow)">
    <circle cx="256" cy="256" r="218" fill="none" stroke="url(#hackerRgb)" stroke-opacity="0.85" stroke-width="2.8" stroke-dasharray="70 180 40 180" stroke-linecap="round" />
    <animateTransform attributeName="transform" type="rotate" from="360 256 256" to="0 256 256" dur="15s" repeatCount="indefinite" />
  </g>

  <!-- MAIN CLIPPED AVATAR CORE -->
  <g clip-path="url(#avatarCircleClip)">
    <rect x="20" y="20" width="472" height="472" fill="url(#hexGridPattern)" />
    <circle cx="256" cy="215" r="185" fill="url(#visorCoreGlow)" />

    <!-- Animated Matrix Binary & Hex Code Streams in Background -->
    <g font-family="Consolas, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1">
      <g class="matrix-col-a" fill="#10B981" opacity="0.48">
        <text x="58" y="95">01010011</text>
        <text x="58" y="115">0x534152</text>
        <text x="58" y="135">ROOT::OK</text>
        <text x="58" y="155">01000100</text>
        <text x="58" y="175">SSH::KEY</text>
        <text x="58" y="195">01010010</text>
        <text x="58" y="215">SYN::ACK</text>
        <text x="58" y="235">01000001</text>
      </g>
      <g class="matrix-col-b" fill="#38BDF8" opacity="0.45">
        <text x="116" y="75">0x7F00A1</text>
        <text x="116" y="95">SARDAR93</text>
        <text x="116" y="115">11010110</text>
        <text x="116" y="135">ENCRYPT+</text>
      </g>
      <g class="matrix-col-b" fill="#38BDF8" opacity="0.45">
        <text x="348" y="85">KERNEL64</text>
        <text x="348" y="105">01010011</text>
        <text x="348" y="125">0x93F4C2</text>
        <text x="348" y="145">NET::SEC</text>
      </g>
      <g class="matrix-col-a" fill="#10B981" opacity="0.48">
        <text x="394" y="100">01000001</text>
        <text x="394" y="120">0x4B4152</text>
        <text x="394" y="140">FIREWALL</text>
        <text x="394" y="160">01010010</text>
        <text x="394" y="180">ZERO-DAY</text>
        <text x="394" y="200">10110011</text>
        <text x="394" y="220">TLS::1.3</text>
      </g>
    </g>

    <!-- Vertical Laser Radar Sweep Line -->
    <rect x="30" y="30" width="452" height="50" fill="url(#scanLineGrad)">
      <animate attributeName="y" values="30;430;30" dur="5.8s" repeatCount="indefinite" />
    </rect>

    <!-- ELITE CYBER-HACKER HOODED SILHOUETTE -->
    <g class="hacker-float">
      <!-- Tactical Shoulders & Cyber Armor Jacket -->
      <path
        d="M 74 470 C 82 374, 134 334, 188 320 L 256 346 L 324 320 C 378 334, 430 374, 438 470 Z"
        fill="url(#hoodOuterGrad)"
        stroke="url(#hackerRgb)"
        stroke-width="2.6"
        stroke-linejoin="round"
      />

      <!-- Shoulder Neon Circuit Traces -->
      <g fill="none" stroke="url(#hackerRgb)" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
        <path d="M 112 425 L 146 376 L 194 376" />
        <circle cx="194" cy="376" r="3" fill="#38BDF8" />
        <path d="M 400 425 L 366 376 L 318 376" />
        <circle cx="318" cy="376" r="3" fill="#10B981" />
        <path d="M 164 340 L 210 388 L 210 436" stroke="#38BDF8" stroke-opacity="0.55" />
        <path d="M 348 340 L 302 388 L 302 436" stroke="#38BDF8" stroke-opacity="0.55" />
      </g>

      <!-- East Turkistan Sky-Blue Crescent & Star Stealth Crest on Hacker Chest Core -->
      <g transform="translate(256, 386)" filter="url(#cyberGlow)">
        <polygon points="0,-28 26,-14 26,14 0,28 -26,14 -26,-14" fill="#041022" stroke="#38BDF8" stroke-width="1.8" />
        <g transform="translate(-4, 0) scale(0.32)">
          <path d="M 32 -40 A 48 48 0 1 0 32 40 A 38 38 0 1 1 32 -40 Z" fill="#38BDF8" />
          <polygon points="68,0 50,6 51,25 39,10 21,16 32,0 21,-16 39,-10 51,-25 50,-6" fill="#FFFFFF" />
        </g>
      </g>

      <!-- Outer Stealth Hoodie Cowl -->
      <path
        d="M 142 332 C 122 252, 134 146, 188 102 C 218 78, 256 68, 256 68 C 256 68, 294 78, 324 102 C 378 146, 390 252, 370 332 C 344 352, 304 364, 256 364 C 208 364, 168 352, 142 332 Z"
        fill="url(#hoodOuterGrad)"
        stroke="url(#hackerRgb)"
        stroke-width="2.8"
        stroke-linejoin="round"
        filter="url(#crispShadow)"
      />

      <!-- Hoodie Inner Seam Folds -->
      <path
        d="M 256 68 L 256 102 M 164 156 C 148 210, 152 272, 174 322 M 348 156 C 364 210, 360 272, 338 322"
        fill="none"
        stroke="#38BDF8"
        stroke-opacity="0.4"
        stroke-width="1.6"
        stroke-linecap="round"
      />

      <!-- Deep Hood Shadow Void (Anonymous Hacker Face Cavity) -->
      <path
        d="M 176 286 C 162 224, 172 152, 212 122 C 232 108, 256 102, 256 102 C 256 102, 280 108, 300 122 C 340 152, 350 224, 336 286 C 314 318, 286 332, 256 332 C 226 332, 198 318, 176 286 Z"
        fill="url(#hoodShadowGrad)"
        stroke="#1E293B"
        stroke-width="1.5"
      />

      <!-- Cyber-Respirator / Tactical Lower Face Mask -->
      <path
        d="M 196 244 L 256 232 L 316 244 L 304 298 L 256 324 L 208 298 Z"
        fill="#081528"
        stroke="#38BDF8"
        stroke-opacity="0.65"
        stroke-width="1.6"
      />
      <!-- Mask Tech Vent Grilles -->
      <g stroke="url(#hackerRgb)" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
        <line x1="216" y1="266" x2="238" y2="274" />
        <line x1="218" y1="278" x2="238" y2="286" />
        <line x1="222" y1="290" x2="238" y2="296" />
        <line x1="296" y1="266" x2="274" y2="274" />
        <line x1="294" y1="278" x2="274" y2="286" />
        <line x1="290" y1="290" x2="274" y2="296" />
        <line x1="256" y1="242" x2="256" y2="312" stroke="#38BDF8" stroke-opacity="0.45" />
      </g>

      <!-- GLOWING CYBER-HACKER VISOR OPTICS (EYES) -->
      <g filter="url(#cyberGlow)">
        <!-- Left Visor Lens -->
        <polygon
          points="184,196 248,205 244,224 190,217"
          fill="url(#visorLensGrad)"
          stroke="#FFFFFF"
          stroke-width="1.2"
        />
        <g clip-path="url(#visorClipLeft)">
          <rect x="180" y="190" width="18" height="40" fill="#FFFFFF" opacity="0.65" transform="skewX(-20)" class="visor-glint" />
        </g>

        <!-- Right Visor Lens -->
        <polygon
          points="328,196 264,205 268,224 322,217"
          fill="url(#visorLensGrad)"
          stroke="#FFFFFF"
          stroke-width="1.2"
        />
        <g clip-path="url(#visorClipRight)">
          <rect x="260" y="190" width="18" height="40" fill="#FFFFFF" opacity="0.65" transform="skewX(-20)" class="visor-glint" />
        </g>

        <!-- Center Visor Bridge -->
        <line x1="248" y1="208" x2="264" y2="208" stroke="#FFFFFF" stroke-width="2" />
      </g>
    </g>

    <!-- FOREGROUND CYBER-TERMINAL COMMAND DECK -->
    <g transform="translate(86, 404)" filter="url(#crispShadow)">
      <rect x="0" y="0" width="340" height="62" rx="14" fill="#040B16" fill-opacity="0.95" stroke="url(#hackerRgb)" stroke-width="1.8" />
      <!-- Terminal Window Dots -->
      <circle cx="16" cy="14" r="3" fill="#F43F5E" />
      <circle cx="26" cy="14" r="3" fill="#FACC15" />
      <circle cx="36" cy="14" r="3" fill="#10B981" />
      <text x="170" y="17" text-anchor="middle" fill="#10B981" font-family="Consolas, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8">
        root@uy-sardar:~# ./sardar --stealth
      </text>
      <rect x="308" y="8" width="6" height="10" fill="#10B981" class="term-cursor" />

      <!-- Crisp Pure White Name Signature Inside Avatar Deck -->
      <text x="170" y="46" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="900" letter-spacing="1.2">
        SARDAR · سەردار
      </text>
    </g>
  </g>

  <!-- Top Tactical Status Tag -->
  <rect x="176" y="14" width="160" height="22" rx="11" fill="#040D1A" stroke="url(#hackerRgb)" stroke-width="1.3" />
  <text x="256" y="29" text-anchor="middle" fill="#E0F2FE" font-family="Consolas, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2">
    CYBER::@UY-SARDAR
  </text>
</svg>