        <g transform="translate(178, 174)" filter="url(#glow)">
          <path d="M 32 -40 A 48 48 0 1 0 32 40 A 38 38 0 1 1 32 -40 Z" fill="#FFFFFF" />
          <polygon points="68,0 50,6 51,25 39,10 21,16 32,0 21,-16 39,-10 51,-25 50,-6" fill="#FFFFFF" />
