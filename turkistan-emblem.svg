    <line x1="36" y1="170" x2="304" y2="170" stroke="#38BDF8" stroke-opacity="0.1" stroke-width="1" />
    <rect x="30" y="20" width="280" height="44" fill="url(#lensScan)">
      <animate attributeName="y" values="20;280;20" dur="5.2s" repeatCount="indefinite" />
    </rect>
