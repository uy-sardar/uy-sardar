      </g>
    </g>
  </g>
  <text x="42" y="178" fill="#7DD3FC" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="800" class="bracket">&lt;</text>
  <text x="274" y="178" fill="#7DD3FC" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="800" class="bracket">/&gt;</text>
  <rect x="70" y="262" width="200" height="26" rx="13" fill="#071529" stroke="url(#ringCyan)" stroke-opacity="0.85" stroke-width="1.4" />
  <text x="170" y="279.5" text-anchor="middle" fill="#FFFFFF" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="800" letter-spacing="1.1">
    @uy-sardar · سەردار
