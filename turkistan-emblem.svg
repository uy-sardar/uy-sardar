<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340" role="img" aria-label="uy-sardar Animated Developer Emblem">
  <defs>
    <radialGradient id="coreBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0E294B" />
      <stop offset="68%" stop-color="#081426" />
      <stop offset="100%" stop-color="#040914" />
    </radialGradient>
    <linearGradient id="ringCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#A855F7;#F43F5E;#10B981;#38BDF8" dur="8.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0EA5E9">
        <animate attributeName="stop-color" values="#0EA5E9;#EC4899;#F59E0B;#22D3EE;#0EA5E9" dur="8.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#38BDF8;#F43F5E;#A855F7;#10B981" dur="8.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="emblemMapBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="lensScan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.0" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="innerCircleClip">
      <circle cx="170" cy="170" r="134" />
    </clipPath>
  </defs>
  <style>
    @keyframes mapPulse { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes traceRing { 0% { stroke-dashoffset: 1600; } 100% { stroke-dashoffset: 0; } }
    @keyframes bracketPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    .float-core { animation: mapPulse 4.5s ease-in-out infinite; }
    .trace-border { stroke-dasharray: 180 1420; animation: traceRing 6.5s linear infinite; }
    .bracket { animation: bracketPulse 3.2s ease-in-out infinite; }
  </style>
  <circle cx="170" cy="170" r="156" fill="url(#coreBg)" stroke="url(#ringCyan)" stroke-width="4.2" />
  <g>
    <circle cx="170" cy="170" r="146" fill="none" stroke="#38BDF8" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="10 8 2 8" />
    <animateTransform attributeName="transform" type="rotate" from="0 170 170" to="360 170 170" dur="30s" repeatCount="indefinite" />
  </g>
  <g filter="url(#glow)">
    <circle cx="170" cy="170" r="137" fill="none" stroke="url(#ringCyan)" stroke-opacity="0.8" stroke-width="2.4" stroke-dasharray="55 160 35 160" stroke-linecap="round" />
    <animateTransform attributeName="transform" type="rotate" from="360 170 170" to="0 170 170" dur="16s" repeatCount="indefinite" />
  </g>
  <g>
    <circle cx="170" cy="24" r="4.2" fill="#E0F2FE" filter="url(#glow)" />
    <animateTransform attributeName="transform" type="rotate" from="0 170 170" to="360 170 170" dur="10s" repeatCount="indefinite" />
  </g>
  <g clip-path="url(#innerCircleClip)">
